# Production stack, deployed by .github/workflows/deploy.yml.
# Behind the host's nginx-proxy + acme companion on the external `main` network.
services:
  app:
    image: ${APP_IMAGE:?set by the deploy job}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${APP_HOST:?}
      VIRTUAL_PORT: '3000'
      LETSENCRYPT_HOST: ${APP_HOST:?}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?}
    volumes:
      - data:/data
    networks:
      - main
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/playthroughs').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  data:

networks:
  main:
    external: true
