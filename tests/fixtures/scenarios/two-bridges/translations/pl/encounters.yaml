- id: wolf-ambush
  text: |
    Trzciny się rozstępują i wilk rzuca się na ciebie.
  victory:
    text: |
      Wilk utyka w dal. Brzeg znów cichnie.
  surrender:
    text: |
      Spuszczasz wzrok i wycofujesz się w płyciznę, aż trzciny cię ukryją.
      Wilk patrzy, po czym odwraca się.
  draw:
    text: |
      Trwasz w miejscu bez ataku. Wilk zatacza krąg i znika w trzcinach.
