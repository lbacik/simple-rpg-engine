# startRange follows the #184 Q12 table (near + non-archer becomes melee).
- id: wolf-ambush
  enemy: river-wolf
  startRange: melee
  text: |
    The reeds part, and the wolf is on you.
  victory:
    text: |
      The wolf limps away. The bank is quiet again.
    effects:
      - give-item: { item: bread }
  surrender:
    text: |
      You lower your eyes and back into the shallows until the reeds hide
      you. The wolf watches, then turns away.
    move: east-bank
  draw:
    text: |
      You hold your ground without striking. The wolf circles once, then
      melts into the reeds.
    move: east-bank
