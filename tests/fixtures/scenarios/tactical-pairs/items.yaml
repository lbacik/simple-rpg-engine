# Hunter kit: a ranged weapon so Attack stays legal at any Range, and two
# Consumables so the no-JavaScript flow can heal mid-Combat.
- id: hunting-bow
  kind: equipment
  name: Hunting Bow
  description: A supple yew bow.
  slot: weapon
  reach: ranged
  damage: 3

- id: hunters-cloak
  kind: equipment
  name: Hunter's Cloak
  description: Mottled green wool.
  slot: outfit
  bonus: agility

- id: healing-herbs
  kind: consumable
  name: Healing Herbs
  description: Yarrow and comfrey, chewed and pressed onto wounds.
  heal: 3
