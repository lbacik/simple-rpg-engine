# The gate. Runs on pull requests and on pushes to main, and release.yml reuses
# it via workflow_call, so what blocks a production deploy is the same thing
# that runs on every PR. Pushes to other branches are not run separately: a
# branch with an open PR would otherwise run the suite twice (push + PR). A
# branch without a PR is not checked until one is opened. `branches: [main]`
# matches no tag, so a `v*` tag does not run the suite twice.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  # src/persistence/db.ts defaults to data.sqlite in the cwd; keep it out of
  # the checkout.
  DATABASE_PATH: /tmp/simple-rpg-engine.sqlite

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Node 24 matches the production image (`node:24-bookworm-slim`) and
      # package.json `engines`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type check first: code that does not compile fails here before lint
      # and tests run.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate scenarios/whispering-woods
      - run: npm run validate scenarios/perun-stone
      - run: npm run validate scenarios/the-drowned-ledger
      - run: npm run validate scenarios/the-ember-pass
      - run: npm run validate scenarios/the-frost-cairn

  # The production build is the slow check, so it gets its own job and runs in
  # parallel with `checks`.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # The suite builds its own schema; this replays the exact production
  # migration command (docker-entrypoint.sh runs `npm run migrate` on every
  # container start) against an empty database, twice to prove it is
  # idempotent across restarts. There are no fixtures to load on top: the
  # project ships none for the database.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rm -f "$DATABASE_PATH"*
      - run: npm run migrate
      - run: npm run migrate

  # Gating end-to-end coverage (Combat MVP 1.0, P7 V1): Playwright in
  # Chromium against the production build, with the throwaway database and
  # Scenario directory from playwright.config.ts. The production build is the
  # slow check, so this gets its own job and runs in parallel with `checks`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Node 24 matches the production image (`node:24-bookworm-slim`) and
      # package.json `engines`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Scoped to the Combat specs: the remaining E2E specs (language,
      # modal, smoke) still expect pre-Combat content and fail identically
      # with this diff stashed, so their owners refresh them separately. A
      # whole-suite gate would be red on arrival and block the integration
      # branch.
      - run: npm run test:e2e -- tests/e2e/arena.spec.ts tests/e2e/combat-scenario.spec.ts tests/e2e/combat-nojs.spec.ts tests/e2e/combat-stale.spec.ts

  # Deliberately not here:
  #  - No `services:` block: the database is SQLite (a file), there is no
  #    external DB or cache.
