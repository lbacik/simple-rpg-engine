# Enemy catalog: the Arena Bestiary. Each enemy is staged by the Encounter
# `fight-<id>` and offered by the call scene's choice of the same id.

- id: training-dummy
  name: Training Dummy
  description: Straw, canvas and a grudge. It hits softly but never tires.
  attributes: { might: 0, agility: 0, wits: 0, presence: 0 }
  health: 6
  damage: 1
  reach: melee
  behaviour: steady

- id: pit-wolf
  name: Pit Wolf
  description: A grey hunter that learned to circle before it learned to bite.
  attributes: { might: 2, agility: 1, wits: 1, presence: 0 }
  health: 8
  damage: 2
  reach: melee
  behaviour: steady

- id: cave-bear
  name: Cave Bear
  description: A mountain of fur and temper. It telegraphs its blows, then lands them.
  attributes: { might: 3, agility: 1, wits: 0, presence: 1 }
  health: 14
  damage: 3
  reach: melee
  behaviour: heavy
