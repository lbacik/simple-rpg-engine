# Encounter catalog: one single-opponent fight per Bestiary enemy. Victory
# ends the Playthrough on the triumph Ending; escape lands back at the pit
# with its Outcome text, where the Arena page shows the result screen.

- id: fight-training-dummy
  enemy: training-dummy
  startRange: near
  text: |
    The gate slams shut behind you, {name}. The Training Dummy raises its
    straw fists.
  victory:
    text: |
      The dummy collapses into straw. The benches cheer.
    end: triumph
  escape:
    text: |
      You dive out of the ring before the dummy can corner you.

- id: fight-pit-wolf
  enemy: pit-wolf
  startRange: far
  text: |
    The gate slams shut behind you, {name}. The Pit Wolf circles wide,
    looking for an opening.
  victory:
    text: |
      The wolf slinks off to lick its wounds. The benches cheer.
    end: triumph
  escape:
    text: |
      You vault the fence with the wolf snapping at your heels.

- id: fight-cave-bear
  enemy: cave-bear
  startRange: near
  text: |
    The gate slams shut behind you, {name}. The Cave Bear rears up, roaring.
  victory:
    text: |
      The bear lumbers back to its cave. The benches roar louder than it did.
    end: triumph
  escape:
    text: |
      You roll under the fence as the bear's paw splinters the post.
