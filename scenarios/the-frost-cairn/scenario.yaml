schemaVersion: 2
id: the-frost-cairn
title: The Frost Cairn
description: Brave the freezing fjords and howling crags of the North, breach the ancient burial mound of Jarl Harek Iron-Tooth, and reclaim the stolen Hearth-Rune before eternal frost engulfs the clan.
author: Simple RPG Engine contributors
version: "1.0.0"
language: en
intro: |
  Winter solstice approaches, but this is no natural northern winter. An unnatural, black rime frost creeps down from the sea cliffs of Skallavik, snuffing hearthfires and turning seawater to jagged black ice.

  Last night the ancient burial mound on the high bluff groaned open. Draugar—the frozen, restless dead of a forgotten sea-king—crept into the village, stole the clan's sacred Hearth-Rune, and dragged Astrid the Skald into the barrow depths.

  If the rune is not recovered and the barrow sealed, no living soul in the fjord will survive to see the dawn of spring.
