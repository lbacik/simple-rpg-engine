# Enemy catalog: reusable kinds of opponents, placed through Encounters.

# Profiles follow the #184 Q11 table: fen-hound → raider; draugr-berserker and
# jarl-harek → brute; draugr-sentry → sentinel; frost-archer → archer. All
# statistics come from the profile table.

- id: fen-hound
  name: Shore Fen-Hound
  description: A gaunt, snow-crusted hound with wild amber eyes and fangs that snap in ravenous packs.
  profile: raider

- id: draugr-sentry
  name: Draugr Sentry
  description: A desiccated warrior in rusted chainmail, wielding an ancient notched spear with cold fury.
  profile: sentinel

- id: frost-archer
  name: Draugr Frost-Archer
  description: A withered corpse clutching a horn bow, loosing bone-tipped arrows out of the howling dark.
  profile: archer

- id: draugr-berserker
  name: Draugr Berserker
  description: A towering warrior whose skin is grey as sea-slate, brandishing a two-handed iron war axe.
  profile: brute

- id: jarl-harek
  name: Jarl Harek Iron-Tooth
  description: The ancient sea-king of the barrow, crowned with frosted bone and wreathed in freezing grave-mist.
  profile: brute
