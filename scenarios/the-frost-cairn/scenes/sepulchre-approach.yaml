id: sepulchre-approach
illustration: sepulchre-approach
title: The Sepulchre of Jarl Harek
trigger: on-enter
repeatable: false
when:
  not:
    flag: harek-slain
text: |
  You step through the iron arch into the heart of the barrow. The sepulchre is an immense vaulted dome carved from blue glacial ice and megalithic stone blocks.

  Upon an enormous stone chair sits Jarl Harek Iron-Tooth. A crown of frosted bone rests atop his horned skull, and blue rime smokes from the joints of his blackened ring-mail. In his frozen lap lies the glowing Hearth-Rune of Skallavik.
choices:
  - id: challenge-harek
    text: Draw your steel and advance toward the throne.
    outcome:
      text: |
        Jarl Harek rises from his throne of rime, lifting a massive frost-covered broadsword that crackles with cold lightning. From the freezing shadows an undead spearman steps forward to fight at his flank — and at your side, Astrid sets her feet, ready to guard your flank.

        There will be no binding song to dissolve the guard this time. Steel will decide it.
      start-combat: harek-and-guard
