language: pl
baseVersion: "1.0.0"
translator: Simple RPG Engine contributors
title: Kurhan Mrozu
description: Zmierz się ze skutymi lodem fiordami i wyjącymi turniami Północy, wedrzyj się do prastarego kurhanu jarla Hareka Żelaznozębego i odzyskaj skradzioną Runę Ogniska, nim wieczny mróz pochłonie klan.
intro: |
  Zbliża się przesilenie zimowe, lecz to nie jest zwyczajna północna zima. Nienaturalny, czarny szron spływa z morskich urwisk Skallavik, gasząc ogniska i zamieniając morską wodę w poszarpany czarny lód.

  Ubiegłej nocy prastary kurhan na wysokim klifie jęknął i rozwarł swe wrota. Draugry - zamarznięci, niespokojni zmarli zapomnianego króla mórz - wdarli się do osady, skradli świętą Runę Ogniska klanu i zawlekli skaldkę Astrid w głąb mogiły.

  Jeśli runa nie zostanie odzyskana, a kurhan zapieczętowany, żadna żywa dusza w fiordzie nie doczeka wiosennego świtu.
