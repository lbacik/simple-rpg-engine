id: sepulchre-approach
title: Grobowiec jarla Hareka
text: |
  Przekraczasz żelazny łuk, wkraczając do samego serca kurhanu. Grobowiec to olbrzymia sklepiona kopuła wykuta z błękitnego lodu lodowcowego i megalitycznych bloków skalnych.

  Na potężnym kamiennym tronie zasiada jarl Harek Żelaznozęby. Korona ze zmrożonej kości spoczywa na jego rogatej czaszce, a błękitny szron dymi ze spojeniach jego czernionej kolczugi. Na jego zamarzniętych kolanach spoczywa jarząca się Runa Ogniska ze Skallavik.
choices:
  - id: challenge-harek
    text: Dobądź broni i rusz ku tronowi.
    outcome:
      text: |
        Jarl Harek podnosi się z oszronionego tronu, unosząc potężny zmrożony miecz, który trzeszczy lodowymi błyskawicami. Z lodowatego cienia wyłania się nieumarły włócznik, by walczyć u jego boku — a u twego boku Astrid staje mocno, gotowa osłaniać twoją flankę.

        Tym razem żadna pieśń spętania nie rozproszy straży. Rozstrzygnie stal.
