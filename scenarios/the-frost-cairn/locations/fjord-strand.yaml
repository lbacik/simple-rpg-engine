id: fjord-strand
name: The Frozen Strand
description: |
  Black pebbles and sharp slabs of sea-ice line the shore where dark waves break with the sound of grinding glass. The frozen rib-timbers of longships protrude from the snowdrifts like the skeletons of great whales.
