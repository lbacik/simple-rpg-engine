# Encounter catalog: named, single placements of Enemies.
# Each has opening narration, required surrender and draw Outcomes (both
# inherit the old escape move) and an optional victory Outcome. Surrender and
# draw texts are drafts for human review in P3b (#235). startRanges follow
# the #184 Q12 table (far stays far; near + non-archer becomes melee).

- id: camp-bandit
  enemy: bandit-archer
  startRange: far
  text: |
    The archer backs towards the trees and draws, an arrow already nocked.
  victory:
    text: |
      The bandit slumps against the cold firepit. A bronze key on a thong
      hangs from his belt.
    effects:
      - give-item: { item: barrow-key }
  surrender:
    text: |
      You drop your weapon and raise empty hands. The archer holds the draw
      a moment longer, then jerks his bow towards the trees — take the hint
      and go.
    move: forest-edge
  draw:
    text: |
      You slip sideways between the trunks until neither of you has a clean
      shot. The archer lowers his bow and melts back into the wood.
    move: forest-edge

- id: hollow-wolf
  enemy: grey-wolf
  startRange: far
  text: |
    The wolf lowers its head and comes at you in long, silent bounds.
  victory:
    text: |
      The wolf collapses among the roots. Beyond its den, a path climbs
      towards broken stone walls.
  surrender:
    text: |
      You stop running, crouch low and keep still. The wolf circles once,
      sniffs the wind, and trots off to easier prey.
    move: forest-edge
  draw:
    text: |
      You back away step by step, never turning. The wolf shadows you to
      the bank, then breaks off with a final growl.
    move: forest-edge

- id: wight-fight
  enemy: barrow-wight
  startRange: melee
  text: |
    Aldric rises from his bier, and the cold of the grave rolls over you.
  victory:
    text: |
      The wight crumbles into dust and rust. Mira opens her eyes and reaches
      for your hand.
    end: mira-rescued
  surrender:
    text: |
      You cast yourself flat and crawl back up the passage into the daylight.
      The wight does not follow; it never leaves its tomb.
    move: barrow-mound
  draw:
    text: |
      You retreat to the passage mouth and hold the narrow way with your
      blade. The wight tests the threshold once, then sinks back onto its
      bier.
    move: barrow-mound
