language: pl
baseVersion: "1.0.0"
title: Szepczący las
description: >-
  Z wioski Ashford zniknęła dziewczynka, a las za polami zaczął szeptać.
  Odnajdź ją, zanim kurhan pochłonie ją na zawsze.
intro: |
  Od trzech dni deszcz towarzyszy ci w drodze starym traktem. Gdy dachy
  Ashford wreszcie wyłaniają się z mgły, rozbrzmiewa wiejski dzwon,
  choć nie nadeszło jeszcze ani południe, ani zmierzch.

