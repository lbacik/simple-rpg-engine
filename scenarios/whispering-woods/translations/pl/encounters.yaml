- id: camp-bandit
  text: |
    Łucznik cofa się w stronę drzew i napina łuk ze strzałą już na cięciwie.
  victory:
    text: |
      Rozbójnik osuwa się przy wygasłym palenisku. U jego pasa wisi
      na rzemieniu klucz z brązu.
  surrender:
    text: |
      Upuszczasz broń i unosisz puste dłonie. Łucznik jeszcze chwilę trzyma
      napięty łuk, po czym szarpie nim w stronę drzew — bierz to za
      wskazówkę i idź.
  draw:
    text: |
      Wysuwasz się bokiem między pnie, aż żadne z was nie ma czystego
      strzału. Łucznik opuszcza łuk i znika w lesie.

- id: hollow-wolf
  text: |
    Wilk opuszcza łeb i rzuca się ku tobie długimi, bezgłośnymi susami.
  victory:
    text: |
      Wilk pada między korzeniami. Za jego legowiskiem ścieżka wspina się
      ku zniszczonym kamiennym murom.
  surrender:
    text: |
      Przestajesz biec, kucasz i trwasz w bezruchu. Wilk zatacza krąg,
      węszy wiatr i truchta ku łatwiejszej zdobyczy.
  draw:
    text: |
      Wycofujesz się krok po kroku, nie odwracając się. Wilk odprowadza
      cię do zbocza, po czym odstępuje z ostatnim warczeniem.

- id: wight-fight
  text: |
    Aldric podnosi się z mar, a grobowy chłód zalewa cię falą.
  victory:
    text: |
      Upiór rozsypuje się w pył i rdzę. Mira otwiera oczy i wyciąga rękę
      ku twojej dłoni.
  surrender:
    text: |
      Padasz płasko i czołgasz się korytarzem ku światłu dnia. Upiór nie
      rusza za tobą; nigdy nie opuszcza grobowca.
  draw:
    text: |
      Wycofujesz się do wylotu korytarza i bronisz wąskiego przejścia
      ostrzem. Upiór raz próbuje progu, po czym opada z powrotem na mary.
