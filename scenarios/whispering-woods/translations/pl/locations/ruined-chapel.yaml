id: ruined-chapel
name: Zrujnowana kaplica
description: |
  Cztery zniszczone ściany i niebo zamiast dachu. Bluszcz pochłonął
  wyrzeźbione nad wejściem postacie świętych, ale ołtarz wciąż stoi.
connections:
