# Enemy catalog: reusable kinds of opponents, placed through Encounters.

# Profiles follow the #184 Q11 table: grey-wolf → raider, barrow-wight →
# brute, bandit-archer → archer. All statistics come from the profile table.

- id: grey-wolf
  name: Grey Wolf
  description: Lean and scarred, with eyes that catch the light like coins.
  profile: raider

- id: bandit-archer
  name: Bandit Archer
  description: A ragged deserter with a longbow and nothing left to lose.
  profile: archer

- id: barrow-wight
  name: Aldric, the Barrow Wight
  description: >-
    A lord of the old kingdom, bound to his grave by a broken oath. Frost
    creeps from his rusted mail.
  profile: brute
