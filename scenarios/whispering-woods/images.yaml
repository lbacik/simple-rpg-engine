- id: loc-ashford
  path: images/loc-ashford.png
  alt: >-
    The village of Ashford: thatched cottages, muddy cart ruts, and an old
    stone well under an overcast sky, with the dark woods brooding in the
    distance.

- id: loc-forest-edge
  path: images/loc-forest-edge.png
  alt: >-
    The edge of the forest: ancient oak trees towering over the end of the cart
    track, with leaves swirling in the murmuring wind.

- id: loc-hunters-camp
  path: images/loc-hunters-camp.png
  alt: >-
    An abandoned hunters' camp in a pine clearing, with a branch lean-to and a
    ring of blackened hearth stones.
  # PROTOTYPE (#209): the example layered Illustration.
  motion:
    layers:
      - path: images/layers/hunters-camp-sun.webp
        blend: multiply
        flicker: { depth: 40 }
      - path: images/layers/crow.webp
        frames: 8
        fps: 4
        # Centre of a 4%-wide square frame whose feet (97% down the frame)
        # stand on the stump top at { x: 33.4, y: 65.8 }.
        at: { x: 33.4, y: 62.5 }
        width: 4
      - path: images/layers/bird.webp
        frames: 4
        fps: 5
        width: 4
        drift:
          from: { x: 38, y: 16 }
          to: { x: 108, y: 9 }
          duration: 14
          delay: 1.5
      - path: images/layers/bird.webp
        frames: 4
        fps: 6
        width: 3.2
        drift:
          from: { x: -5, y: 23 }
          to: { x: 105, y: 19 }
          duration: 24
          delay: 8
          loop: true
    camera:
      to: { zoom: 110, x: 30, y: 55 }
      duration: 18

- id: loc-wolf-hollow
  path: images/loc-wolf-hollow.png
  alt: >-
    A damp woodland hollow choked with ferns, where a massive fallen beech tree
    and its tangled roots conceal gnawed bones.

- id: loc-ruined-chapel
  path: images/loc-ruined-chapel.png
  alt: >-
    The exterior of a ruined roofless stone chapel with crumbling gothic
    windows, ivy-strangled archways, and a distant view of the altar inside.

- id: loc-barrow-mound
  path: images/loc-barrow-mound.png
  alt: >-
    A high grassy burial mound crowned with weathered standing megaliths, with
    a rune-carved stone slab door set into the hillside.

- id: loc-barrow-tomb
  path: images/loc-barrow-tomb.png
  alt: >-
    The interior of a low stone crypt lit by an ethereal cold glow, where an
    armored wight rests upon a stone bier and a sleeping girl lies in grave-cloths.

