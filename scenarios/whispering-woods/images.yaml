- id: wolf-den
  path: images/wolf-den.png
  alt: >-
    A grey wolf watching alertly from dense ferns beside a fallen tree trunk.

- id: wolf-again
  path: images/wolf-again.png
  alt: >-
    A snarling grey wolf prowling through the ferns, barring the woodland
    path.

- id: chapel-threshold
  path: images/chapel-threshold.png
  alt: >-
    The collapsed stone floor of a ruined chapel falling into a dark crypt with
    tilting flagstones.

- id: chapel-altar
  path: images/chapel-altar.png
  alt: >-
    A roofless stone chapel overgrown with ivy; on a cracked altar, a small
