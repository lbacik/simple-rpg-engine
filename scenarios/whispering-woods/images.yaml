# Image catalog. Paths are relative to the Scenario directory.

- id: arrival
  path: images/arrival.png
  alt: >-
    Brenna hurries across the Ashford village green with the bell tower rope
    swinging behind her.

- id: elder-plea
  path: images/elder-plea.png
  alt: >-
    Elder Brenna pleading outside her cottage, offering a bundle of medicinal
