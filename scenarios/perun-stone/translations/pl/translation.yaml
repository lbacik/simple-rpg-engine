language: pl
baseVersion: "1.0.0"
title: Kamień Peruna
description: Susza trawi słowiańską wieś, boski piorunek zniknął, a stos rośnie dla
  niewłaściwej osoby. Wypytaj duchy, odpowiedz na zagadki Południcy i przyłap prawdziwego
  złodzieja na kłamstwie.
intro: |
  Od czterdziestu dni na Dębinę nie spadła ani kropla deszczu. Żyto stoi na polach rzadkie
  i bielejące, rzeka skurczyła się do sznura kałuż, a starzy ludzie powiadają, że niebo
  zapomniało o wsi.

  Trzy dni temu Bogumił, strażnik Dębu Peruna, otworzył skrzynię pod ołtarzem, by
  przygotować się do Nocy Kupały, i zastał ją pustą. Piorunek zniknął: grot samego boga,
  który od dziewięciu pokoleń przyzywał nad Dębinę burze. Bogumił twierdzi, że wie, kto go
  zabrał. Zielarka ze skraju lasu, którą dzieci nazywają Babą Jagą, doi chmury do
  swoich skopków. W Noc Kupały, obiecuje, wieś rozpali dwa ogniska.

  Docierasz o zmierzchu, prosto z zakurzonego gościńca, akurat gdy wieś zbiera się pod lipą.
