id: pond-arrival
title: Pan Czarnego Stawu
text: |
  Woda się marszczy, choć nie ma wiatru. Na jaz wspina się drobna postać i siada, machając
  nogami: człowieczek nie większy od dziecka, ze skórą koloru rdestnicy i jaskrawoczerwoną
  czapką. Z lewej poły jego kapoty kapie woda, równo jak tykanie, choć cała reszta jest
  zupełnie sucha.

  „Gość!” — cieszy się utopiec. — „Goście trafiają się tak rzadko, odkąd młynarz przestał
  zaglądać. Pewnie po gorący kamień, co? Wszyscy chcą gorącego kamienia. Trzymam go pod
  garnkiem w moim domu pod wodą, razem z innymi skarbami”. Szczerzy zęby jak u szczupaka.
  „Może zagramy o niego?”
