id: oak-arrival
title: Strażnik dębu
text: |
  Bogumił dociera na szczyt tuż po tobie, ciężko dysząc, i wbija kostur w ziemię obok
  zimnego ołtarza.

  „Patrz, przybyszu. Dziewięć pokoleń płonął ten ogień. Czterdzieści dni temu, w noc bez
  księżyca, zgasł, jakby ktoś wylał na niego wiadro. Każdy ogień, który od tamtej pory
  rozpalam, tylko dymi. Trzy dni temu otworzyłem skrzynię, żeby przygotować się do Kupały, i
  kamienia nie było. Klucz nigdy nie opuszcza mojego pasa, a zamek nie był wyłamany”.

  Wskazuje palcem na zachód, ku odległemu lasowi. „Kto ma wiadra wody w czas suszy?
  Wiedźma, która doi chmury”.

  Uświadamiasz sobie, że jest bardziej przerażony niż okrutny. Ale przerażeni ludzie budują
  stosy.
