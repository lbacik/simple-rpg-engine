schemaVersion: 2
id: perun-stone
title: Perun's Stone
description: A drought grips a Slavic village, the god's thunderstone is gone and a pyre is
  being built for the wrong person. Question spirits, answer the Noon Wraith's riddles and
  catch the real thief in a lie.
author: Simple RPG Engine contributors
version: "1.0.0"
language: en
intro: |
  For forty days no rain has fallen on Dębina. The rye stands thin and white in the
  fields, the river has shrunk to a string of puddles, and the old people say the sky has
  forgotten the village.

  Three days ago Bogumił, keeper of Perun's Oak, opened the chest beneath the altar to
  prepare for Kupała Night and found it empty. The thunderstone is gone: the god's own
  arrowhead, which has called the storms to Dębina for nine generations. Bogumił says he
  knows who took it. The herb-woman at the forest's edge, whom the children call Baba
  Jaga, milks the clouds into her pails. On Kupała Night, he promises, the village will
  light two fires.

  You arrive at dusk, dusty from the road, just as the whole village gathers under the
  linden tree.
