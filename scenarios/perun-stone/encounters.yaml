# Encounter catalog: named, single placements of Enemies.
# Each has opening narration, required surrender and draw Outcomes (both
# inherit the old escape move) and an optional victory Outcome. Surrender and
# draw texts are drafts for human review in P3b (#235). startRanges follow
# the #184 Q12 table (far stays far; near + non-archer becomes melee).

- id: wolf-fight
  enemy: leszy-wolf
  startRange: far
  text: |
    The grey wolf comes off the ground like a released bowstring. Behind it, the Leszy
    watches without moving, the way a forest watches a storm.
  victory:
    text: |
      The wolf lies still among the ferns. The Leszy looks at you for a long time. "Teeth,"
      he says at last. "Dębina always has teeth." But he speaks.
    next: leszy-testimony
  surrender:
    text: |
      You go still, turn your eyes aside and back away with open hands. The wolf
      stops mid-stride, ears up, and lets you go — the Leszy's hunt is not for
      you today.
    move: forest-edge
  draw:
    text: |
      You set your back against a windfall and neither advance nor flee. The wolf
      circles once, twice, then melts into the ferns to find easier prey.
    move: forest-edge

- id: utopiec-fight
  enemy: utopiec
  startRange: melee
  text: |
    The utopiec does not let go of the weir, and the weir comes with him. The pond rises in
    a black wave. Suddenly you are knee-deep, then waist-deep, and the little man is not
    little any more.
  victory:
    text: |
      The utopiec bursts like a bladder full of water and is gone. Only his red cap is left,
      turning slowly among the reeds. The pond drops a hand's breadth all at once.

      In the mud by the weir lies a black stone, hot enough to steam, among a scatter of
      broken clay pots. Pale lights rise from the shards like bubbles and drift away over
      the reeds. One of them lingers by the dyke, near the mill, before it goes.
    effects:
      - give-item:
          item: thunderstone
  surrender:
    text: |
      You spread empty hands and let the black water carry you back, step by step,
      until your feet find the dyke. The little man watches you climb out, then
      settles back onto his weir, wringing out his coat-tail.
    move: mill
  draw:
    text: |
      You brace against a weir-post and hold the narrow footing, giving no ground
      and taking none. The pond sinks back at last, black and patient, and the
      utopiec lets the water have you — this time.
    move: mill
