id: mill-pond
illustration: loc-mill-pond
name: The Black Pond
description: |
  The pond is brim-full and perfectly still, black as a well at night. Reeds stand in it
  up to their necks, and the willows lean over the water as though listening.

  On the weir, where the water spills towards the mill, the reeds are bent flat, as if
  someone often sits there. Under the surface, now and then, something knocks like clay
  on clay.
