id: deep-forest
illustration: loc-deep-forest
name: The Old Forest
description: |
  Under the old trees it is cool for the first time in forty days. Moss swallows your
  footsteps. Paths appear between the trunks and vanish when you look at them twice, and
  somewhere a woodpecker knocks in the rhythm of a laugh.

  At the heart of the forest lies a clearing ringed by oak stumps, each one cut clean by an
  axe. Something here keeps count of them.
