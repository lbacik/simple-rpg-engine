id: pond-arrival
illustration: pond-arrival
title: The Master of the Black Pond
trigger: on-enter
text: |
  The water stirs, though there is no wind. A small figure climbs onto the weir and sits
  there, swinging his feet: a man no taller than a child, with skin the colour of pondweed
  and a bright red cap. Water drips from the left tail of his coat, steady as a clock, while
  the rest of him is perfectly dry.

  "A guest!" says the utopiec, delighted. "Guests are so rare since the miller stopped
  visiting. You've come for the hot stone, haven't you? Everyone wants the hot stone. I keep
  it under a pot in my house beneath the water, with my other treasures." He grins, showing
  teeth like a pike's. "Perhaps we'll play for it."
