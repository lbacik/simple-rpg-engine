id: miller-lie-oak
illustration: miller-lie-oak
title: "\"I Haven't Been Up the Hill\""
repeatable: true
text: |
  "The oak?" Radzim heaves another sack onto the pile. "I haven't climbed that hill since
  Jare Gody, in spring. The oak is Bogumił's business. Mine is flour."
choices:
  - id: show-flour
    text: Tell him about the wheat flour you found inside the thunderstone's chest.
    when:
      flag: flour-found
    outcome:
      text: |
        Radzim stops with a sack on his shoulder. Slowly he lowers it. "Wheat flour," he
        says. "All right. I took the Kupała flour up the hill. A month back, maybe more. I
        must have leaned on the chest."
      next: miller-lie-night
  - id: show-witness
    text: Tell him he was seen on the night of the dark moon.
    when:
      any:
        - flag: ghost-seen
        - flag: leszy-heard
    outcome:
      text: |
        "Seen? Seen up on the hill? Nobody saw me on that hill, because I wasn't there." He
        turns back to his sacks, and you know you have lost him for now.
  - id: show-marzenka
    text: Speak Marzenka's name, and say what the water keeps of her.
    when:
      flag: knows-marzenka
    outcome:
      text: |
        Radzim goes rigid. "You don't speak her name in my mill," he says, very quietly.
        "Get out." He does not turn around until you have gone.
  - id: show-pond
    text: Point out that his pond is full while the whole valley is dry.
    outcome:
      text: |
        "A spring. I told you." He doesn't even look up. "What has my pond to do with
        Bogumił's hill?"
  - id: threaten
    text: Threaten to tell Bogumił that you suspect him.
    outcome:
      text: |
        Radzim laughs without humour. "Tell him. He'll ask whose flour his Kupała bread is
        made of." He goes back to work, and you get nothing more out of him today.
  - id: back-off
    text: Let it go for now.
