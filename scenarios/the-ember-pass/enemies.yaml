# Enemy catalog: reusable kinds of opponents, placed through Encounters.

# Profiles follow the #184 Q11 table: ridge-wolf, cinder-raider,
# tunnel-crawler, deep-ghoul and ash-hound → raider; stone-troll, clan-brute
# and gharra → brute; clan-bowman and ember-shaman → archer. All statistics
# come from the profile table.

- id: ridge-wolf
  name: Ridge Wolf
  description: A lean grey wolf that has learned to follow the clan's fires for scraps.
  profile: raider

- id: cinder-raider
  name: Cinder Raider
  description: A clan warrior in soot-blackened leather with a notched falchion.
  profile: raider

- id: clan-bowman
  name: Clan Bowman
  description: A raider with a short horn bow who likes to take his time over a shot.
  profile: archer

- id: stone-troll
  name: Ford Troll
  description: A slow grey troll with river weed in its beard and a boulder for a club.
  profile: brute

- id: tunnel-crawler
  name: Tunnel Crawler
  description: A pale, many-legged thing the size of a hound that hunts by touch.
  profile: raider

- id: deep-ghoul
  name: Deep Ghoul
  description: A miner who never came up, still swinging his pick at something.
  profile: raider

- id: clan-brute
  name: Clan Brute
  description: A giant in a scorched bearskin who fights with a smith's maul.
  profile: brute

- id: ash-hound
  name: Ash Hound
  description: A scorched black hound with embers caught in its fur.
  profile: raider

- id: ember-shaman
  name: Ember Shaman
  description: A clan seer who throws handfuls of burning cinders that stick and sear.
  profile: archer

- id: gharra
  name: Gharra Ashmane
  description: The Cinder Warlord, ash-streaked and tireless, with a great two-handed axe.
  profile: brute
