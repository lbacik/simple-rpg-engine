id: old-mine
illustration: loc-old-mine
name: The Greywatch Mine
description: |
  A narrow adit runs into the mountain, shored up with timbers gone soft with age. Your
  lantern shows old pick marks, rusted rails and, here and there, scratches that no pick
  made.
