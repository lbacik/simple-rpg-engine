schemaVersion: 2
id: the-ember-pass
title: The Ember Pass
description: Fight your way up a mountain road held by the Cinder Clan, free the captives
  of Kessford and light the beacon that calls the king's riders. Expect steel at every turn.
author: Simple RPG Engine contributors
version: "1.0.0"
language: en
intro: |
  Three nights ago the beacon on the Ember Pass went dark. Since then no caravan has come
  down the mountain road, and the shepherds of Kessford have stopped counting their flocks.

  The Cinder Clan has come south over the burnt hills: raiders in soot-blackened leather,
  wolves that follow their fires, and a warlord who wears the ash of every village she
  has taken. If the beacon is lit again, the king's riders at Varrow will see it and come.
  Someone has to carry the fire up the pass first.
