language: pl
baseVersion: "1.0.0"
title: Przełęcz Żaru
description: Przebij się górską drogą zajętą przez Klan Zgliszcz, uwolnij jeńców z Kessford
  i zapal ognisko, które wezwie królewskich jeźdźców. Stal czeka na każdym zakręcie.
intro: |
  Trzy noce temu zgasło ognisko sygnałowe na Przełęczy Żaru. Od tamtej pory żadna
  karawana nie zjechała górską drogą, a pasterze z Kessford przestali liczyć owce.

  Klan Zgliszcz przyszedł z północy, przez spalone wzgórza: łupieżcy w okopconych
  skórach, wilki, które ciągną za ich ogniskami, i wodzini, która nosi na sobie popiół
  każdej zdobytej wioski. Jeśli ognisko znów zapłonie, królewscy jeźdźcy w Varrow
  zobaczą je i przybędą. Ktoś jednak musi najpierw zanieść ogień na przełęcz.
