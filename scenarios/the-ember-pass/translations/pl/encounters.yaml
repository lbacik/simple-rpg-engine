# Surrender and draw texts are drafts for human review in P3b (#235).
- id: road-wolves
  text: |
    Wilki rozdzielają się w biegu, jeden na każdą stronę drogi, tak żeby nie dało się
    pilnować obu naraz.
  victory:
    text: |
      Drugi wilk pada we wrzosy. Droga przed tobą cichnie, a gdzieś w górze kruk skarży się
      na hałas.
  surrender:
    text: |
      Upuszczasz broń, kucasz nisko i trwasz bez ruchu. Wilki podchodzą, węsżą
      wokół ciebie powietrze i uznają, że sprawiasz więcej kłopotu niż padły muł.
      Wracają truchtem w dół drogi.
  draw:
    text: |
      Wycofujesz się w dół drogi krok po kroku, z bronią w górze, nie odwracając
      się. Wilki odprowadzają cię do zakrętu, potem odpuszczają i wracają do
      padłego muła.

- id: tower-assault
  text: |
    Łupieżca kopniakiem otwiera drzwi wieży i schodzi po stopniach z dobytym tasakiem.
    Na blankach nad nim łucznik nakłada strzałę na cięciwę.
  victory:
    text: |
      Greywatch należy do ciebie. W wartowni znajdujesz łupy rabusiów: dwa rogi napoju
      leczniczego i sztabę czarnego żelaza klanu, którą kowal Dunric na pewno chciałby
      zobaczyć.
  surrender:
    text: |
      Rzucasz broń i unosisz puste dłonie tak, by łucznik je widział. Strażnik
      spod drzwi macha tasakiem, odprawiając cię — klan chętnie zatrzyma wieżę,
      a ty chętnie zachowasz życie i pójdziesz dalej.
  draw:
    text: |
      Wycofujesz się na drogę, trzymając mur wieży między sobą a blankami, aż
      strzały przestają stukać o kamienie. Nikt cię nie goni; klanowi wystarczy,
      że zatrzyma wieżę.

- id: tower-roof
  text: |
    Przerzucasz się przez blanki tuż obok łucznika. Ten upuszcza strzałę i sięga po nóż.
  victory:
    text: |
      Łucznik leci za blanki. Pod tobą trzaskają drzwi i ciężkie buty zaczynają dudnić po
      schodach wieży.
  surrender:
    text: |
      Puszczasz nóż i cofasz się pod blanki z otwartymi dłońmi. Łucznik trzyma
      cię na ostrzu przez całą drogę w dół muru — schodzisz szybciej, niż
      udało się wejść, a on pozwala ci odejść.
  draw:
    text: |
      Przerzucasz się z powrotem przez blanki i zamierasz na murze, w połowie
      drogi w dół, aż łucznik wróci do swojej warty. Potem schodzisz szybciej,
      niż udało się wejść.

- id: tower-stairs
  text: |
    Strażnik spod drzwi wypada ze schodów na dach, tasakiem naprzód, i zastaje cię
    w gotowości.
  victory:
    text: |
      Greywatch należy do ciebie. W wartowni znajdujesz łupy rabusiów: dwa rogi napoju
      leczniczego i sztabę czarnego żelaza klanu, którą kowal Dunric na pewno chciałby
      zobaczyć.
  surrender:
    text: |
      Upuszczasz broń na dachówki i klękasz. Strażnik ryczy na pozostałych, po czym
      rezygnuje z opuszczania wieży — macha cię ku blankom, a ty przechodzisz
      przez nie i schodzisz po murze.
  draw:
    text: |
      Oddajesz pole na dachu krok po kroku, aż plecami dotykasz blanków. Strażnik
      trzyma drzwi schodów i nie opuści swojej wieży; przechodzisz przez blanki
      i schodzisz po murze.

- id: ford-troll
  text: |
    Troll dźwiga się z rzeki, woda leje mu się z barków, i unosi w obu rękach głaz.
  victory:
    text: |
      Troll wali się w bród z pluskiem, który moczy cię do pasa. Pod mostem znajdujesz jego
      skarb: rzeczne śmieci, stare kości i kilka rzeczy, które warto zatrzymać.
  surrender:
    text: |
      Kładziesz broń na brzegu i wycofujesz się z brodu tyłem, z otwartymi
      dłońmi. Troll patrzy, jak odchodzisz, z wciąż uniesionym głazem, po czym
      zapada się z powrotem w dąsanie pod swoim mostem.
  draw:
    text: |
      Wdrapujesz się na brzeg i trzymasz wyższy grunt, rzucając kamieniami, by
      trzymać go w szachu, aż troll traci zainteresowanie. Jest zbyt powolny,
      by cię gonić, i wraca dąsać się pod swój most.

- id: mine-crawler
  text: |
    Coś bladego spada ze stropu sztolni z grzechotem nóg, prosto w krąg światła twojej
    latarni.
  victory:
    text: |
      Pełzacz zwija się i przestaje drgać. Dalej tunel opada w stronę kapiącej wody
      i powolnego, cierpliwego stukania.
  surrender:
    text: |
      Stawiasz latarnię delikatnie na ziemi i pełzniesz w tył, nisko i cicho.
      Pełzacz idzie za światłem, nie za tobą — a na słońce za tobą nie wyjdzie.
  draw:
    text: |
      Wycofujesz się ku światłu dnia z latarnią wyciągniętą jak tarczą, aż wylot
      sztolni znajdzie się za twoimi plecami. Pełzacz nie pójdzie za tobą
      na słońce.

- id: depths-pair
  text: |
    Stukanie milknie. Martwy górnik odwraca się od ściany z uniesionym kilofem, a z bocznego
    chodnika wybiega drugi pełzacz, by do niego dołączyć.
  victory:
    text: |
      Ghul wreszcie nieruchomieje, a pełzacz razem z nim. Za nimi zardzewiałe żelazne drzwi
      stoją uchylone na suchą komorę.
  surrender:
    text: |
      Gasisz latarnię, przylegasz płasko do szczeliny i przestajesz się ruszać.
      Kilof przestaje świstać; nogi przestają grzechotać. Gdy się wyczołgujesz,
      ciemność zabrała ich z powrotem — biegniesz ku światłu dnia.
  draw:
    text: |
      Biegniesz ku światłu dnia ze zgrzytem kilofa i grzechotem nóg za plecami
      i trzymasz wylot sztolni plecami do słońca, aż cofną się w mrok.

- id: gate-guards
  text: |
    Obaj strażnicy ruszają spod bramy jednocześnie, pokrzykując jeden do drugiego dla
    dodania sobie odwagi.
  victory:
    text: |
      Drugi strażnik osuwa się na belki bramy. Odsuwasz rygiel, a przy jednym z ciał
      znajdujesz róg napoju leczniczego.
  surrender:
    text: |
      Upuszczasz broń i klękasz na serpentynach z rękami na głowie. Strażnicy
      drwią — i puszczają cię wolno w dół. Nie opuszczą bramy dla kogoś takiego
      jak ty.
  draw:
    text: |
      Wycofujesz się w dół serpentyn spacerem, z bronią w górze, a strażnicy
      drwią za twoimi plecami. Żadna ze stron nie chce kolejnego kroku
      wystarczająco mocno.

- id: gate-lone-guard
  text: |
    Pozostały strażnik o chwilę za późno pojmuje, że dał się oszukać. Dobywa broni, sam.
  victory:
    text: |
      Strażnik pada. Zdejmujesz rygiel z bramy, zanim wróci jego kompan, i bierzesz róg
      napoju leczniczego z jego pasa.
  surrender:
    text: |
      Upuszczasz broń i wycofujesz się z otwartymi dłońmi. Strażnik nie odważy
      się zostawić bramy bez straży — zamiast cię gonić, obrzuca cię wyzwiskami
      w dół serpentyn.
  draw:
    text: |
      Wycofujesz się w dół serpentyn z gardą w górze, aż brama stanie się
      ciemną linią w górze. Strażnik nie odważy się zostawić bramy bez straży.

- id: shrine-brute
  text: |
    Osiłek odwraca się od rozbitego ołtarza i zarzuca młot na ramię, zadowolony, że trafiło
    mu się coś, co może oddać.
  victory:
    text: |
      Osiłek wali się między skorupy kamienia paleniska. W kapliczce zapada cisza, a mały
      ogień w niszy, który próbował zadeptać, wciąż się tli.
  surrender:
    text: |
      Klękasz i kładziesz broń na posadzce kapliczki. Osiłek śmieje się, kopie
      jeszcze raz kamień paleniska dla zasady i macha cię w dół bocznej ścieżki —
      nigdy nie byłeś wart przerywania jego roboty.
  draw:
    text: |
      Zbiegasz boczną ścieżką w dół i trzymasz przesmyk, wyzywając go, by zszedł.
      Osiłek śmieje się i wraca do swojej roboty.

- id: pen-brute
  text: |
    Strażnik zagrody zrywa się ze stołka z młotem już w zamachu i ryczy na pozostałych.
  victory:
    text: |
      Osiłek wali się w błoto. Bierzesz nóż z jego pasa i przecinasz więzy jeńców, a oni
      wciskają ci w ręce zapasy, które zdołali ukraść. „Będziemy na ścieżce na szczyt”,
      mówi chłopak o bystrej twarzy Maren Holt. „Kiedy pójdziesz w górę, pójdziemy z tobą”.
  surrender:
    text: |
      Padasz w błoto z rękami na głowie i udajesz bezwładne ciało. Osiłek kopie
      cię raz dla zasady, ryczy na pozostałych — a dym obozowy połyka cię, gdy
      pełzniesz precz między namiotami.
  draw:
    text: |
      Uskakujesz między namiotami i gubisz go w dymie, wracając wzdłuż lin
      odciągowych, aż jego ryk oddali się w drugą stronę.

- id: shaman-rite
  text: |
    Szaman przerywa pieśń i wskazuje cię garścią płonącego żużlu. Popielny ogar u jego stóp
    pochyla łeb i rusza.
  victory:
    text: |
      Szaman pada we własny ogień, a płomienie z czerwonych stają się zwyczajnie żółte.
      W górze, na szczycie, puszcza coś, co trzymało ognisko w chłodzie.
  surrender:
    text: |
      Padasz na kolana, gasząc tlące się ubranie otwartymi dłońmi na znak, że
      masz dość. Szaman odczytuje ten gest wystarczająco dobrze — wraca do swego
      obrzędu, a ogar pozwala ci odpełznąć między namioty.
  draw:
    text: |
      Wycofujesz się między namioty, wytrzepując iskry z ubrania, z płótnem
      namiotu za plecami, aż pieśń wciągnie szamana z powrotem, a ogar zgubi
      twój zapach w dymie.

- id: warlord-duel
  text: |
    Gharra Ashmane unosi topór i idzie ku tobie bez pośpiechu. Za nią jeńcy z Kessford
    przyparli jej ostatniego łucznika do kamieni ogniska.
  victory:
    text: |
      Wodzini osuwa się na kolana obok zimnego stosu, a potem pada. Tu, ponad chmurami, nic
      już nie stoi między tobą a ogniem.
  surrender:
    text: |
      Wbijasz broń w ziemię i klękasz na otwartej przestrzeni. Gharra przygląda
      ci się dłuższą chwilę, po czym opuszcza topór — klęczący wróg to nie wróg,
      a ona ma przed sobą całą noc. Schodzisz ścieżką ze szczytu żywy.
  draw:
    text: |
      Wyrywasz się i zbiegasz ścieżką ze szczytu, trzymając kamienie ogniska
      między sobą a jej toporem. Gharra pozwala ci odejść; ma przed sobą całą noc.

- id: warlord-and-guard
  text: |
    Gharra Ashmane unosi topór i idzie ku tobie bez pośpiechu. Na kamieniach ogniska za nią
    jej ostatni łucznik nakłada strzałę na cięciwę.
  victory:
    text: |
      Wodzini osuwa się na kolana obok zimnego stosu, a potem pada. Tu, ponad chmurami, nic
      już nie stoi między tobą a ogniem.
  surrender:
    text: |
      Wbijasz broń w ziemię i klękasz tak, by łucznik widział, co robisz.
      Gharra odwołuje strzał — klęczący wróg to nie wróg, a ona ma przed sobą
      całą noc. Schodzisz ścieżką ze szczytu przy strzałach nałożonych, lecz
      niewypuszczonych.
  draw:
    text: |
      Wyrywasz się i zbiegasz ścieżką ze szczytu, a obok świszczą strzały,
      nisko za skałami. Gharra pozwala ci odejść; ma przed sobą całą noc.
