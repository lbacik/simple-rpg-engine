- id: road-wolves
  text: |
    Wilki rozdzielają się w biegu, jeden na każdą stronę drogi, tak żeby nie dało się
    pilnować obu naraz.
  victory:
    text: |
      Drugi wilk pada we wrzosy. Droga przed tobą cichnie, a gdzieś w górze kruk skarży się
      na hałas.
  escape:
    text: |
      Cofasz się w dół drogi z bronią w górze, aż wilki tracą zainteresowanie i wracają
      do padłego muła.

- id: tower-assault
  text: |
    Łupieżca kopniakiem otwiera drzwi wieży i schodzi po stopniach z dobytym tasakiem.
    Na blankach nad nim łucznik nakłada strzałę na cięciwę.
  victory:
    text: |
      Greywatch należy do ciebie. W wartowni znajdujesz łupy rabusiów: dwa rogi napoju
      leczniczego i sztabę czarnego żelaza klanu, którą kowal Dunric na pewno chciałby
      zobaczyć.
  escape:
    text: |
      Biegniesz w stronę drogi, a strzały stukają o kamienie za tobą. Nikt cię nie goni;
      klanowi wystarczy, że zatrzyma wieżę.

- id: tower-roof
  text: |
    Przerzucasz się przez blanki tuż obok łucznika. Ten upuszcza strzałę i sięga po nóż.
  victory:
    text: |
      Łucznik leci za blanki. Pod tobą trzaskają drzwi i ciężkie buty zaczynają dudnić po
      schodach wieży.
  escape:
    text: |
      Przerzucasz się z powrotem przez blanki i schodzisz szybciej, niż udało się wejść.

- id: tower-stairs
  text: |
    Strażnik spod drzwi wypada ze schodów na dach, tasakiem naprzód, i zastaje cię
    w gotowości.
  victory:
    text: |
      Greywatch należy do ciebie. W wartowni znajdujesz łupy rabusiów: dwa rogi napoju
      leczniczego i sztabę czarnego żelaza klanu, którą kowal Dunric na pewno chciałby
      zobaczyć.
  escape:
    text: |
      Przechodzisz przez blanki i schodzisz po murze. Strażnik ryczy za tobą, ale nie
      opuści swojej wieży.

- id: ford-troll
  text: |
    Troll dźwiga się z rzeki, woda leje mu się z barków, i unosi w obu rękach głaz.
  victory:
    text: |
      Troll wali się w bród z pluskiem, który moczy cię do pasa. Pod mostem znajdujesz jego
      skarb: rzeczne śmieci, stare kości i kilka rzeczy, które warto zatrzymać.
  escape:
    text: |
      Wdrapujesz się na brzeg. Troll jest zbyt powolny, by cię gonić, i wraca dąsać się pod
      swój most.

- id: mine-crawler
  text: |
    Coś bladego spada ze stropu sztolni z grzechotem nóg, prosto w krąg światła twojej
    latarni.
  victory:
    text: |
      Pełzacz zwija się i przestaje drgać. Dalej tunel opada w stronę kapiącej wody
      i powolnego, cierpliwego stukania.
  escape:
    text: |
      Wytaczasz się na światło dnia. Pełzacz nie pójdzie za tobą na słońce.

- id: depths-pair
  text: |
    Stukanie milknie. Martwy górnik odwraca się od ściany z uniesionym kilofem, a z bocznego
    chodnika wybiega drugi pełzacz, by do niego dołączyć.
  victory:
    text: |
      Ghul wreszcie nieruchomieje, a pełzacz razem z nim. Za nimi zardzewiałe żelazne drzwi
      stoją uchylone na suchą komorę.
  escape:
    text: |
      Uciekasz w stronę światła, a za tobą zgrzyta kilof i grzechoczą nogi.

- id: gate-guards
  text: |
    Obaj strażnicy ruszają spod bramy jednocześnie, pokrzykując jeden do drugiego dla
    dodania sobie odwagi.
  victory:
    text: |
      Drugi strażnik osuwa się na belki bramy. Odsuwasz rygiel, a przy jednym z ciał
      znajdujesz róg napoju leczniczego.
  escape:
    text: |
      Wycofujesz się w dół serpentyn, a strażnicy drwią z ciebie za plecami.

- id: gate-lone-guard
  text: |
    Pozostały strażnik o chwilę za późno pojmuje, że dał się oszukać. Dobywa broni, sam.
  victory:
    text: |
      Strażnik pada. Zdejmujesz rygiel z bramy, zanim wróci jego kompan, i bierzesz róg
      napoju leczniczego z jego pasa.
  escape:
    text: |
      Wycofujesz się w dół serpentyn. Strażnik nie odważy się zostawić bramy bez straży.

- id: shrine-brute
  text: |
    Osiłek odwraca się od rozbitego ołtarza i zarzuca młot na ramię, zadowolony, że trafiło
    mu się coś, co może oddać.
  victory:
    text: |
      Osiłek wali się między skorupy kamienia paleniska. W kapliczce zapada cisza, a mały
      ogień w niszy, który próbował zadeptać, wciąż się tli.
  escape:
    text: |
      Zbiegasz z powrotem boczną ścieżką. Osiłek śmieje się i wraca do swojej roboty.

- id: pen-brute
  text: |
    Strażnik zagrody zrywa się ze stołka z młotem już w zamachu i ryczy na pozostałych.
  victory:
    text: |
      Osiłek wali się w błoto. Bierzesz nóż z jego pasa i przecinasz więzy jeńców, a oni
      wciskają ci w ręce zapasy, które zdołali ukraść. „Będziemy na ścieżce na szczyt”,
      mówi chłopak o bystrej twarzy Maren Holt. „Kiedy pójdziesz w górę, pójdziemy z tobą”.
  escape:
    text: |
      Uskakujesz między namiotami i gubisz go w dymie.

- id: shaman-rite
  text: |
    Szaman przerywa pieśń i wskazuje cię garścią płonącego żużlu. Popielny ogar u jego stóp
    pochyla łeb i rusza.
  victory:
    text: |
      Szaman pada we własny ogień, a płomienie z czerwonych stają się zwyczajnie żółte.
      W górze, na szczycie, puszcza coś, co trzymało ognisko w chłodzie.
  escape:
    text: |
      Wycofujesz się między namioty, wytrzepując iskry z ubrania.

- id: warlord-duel
  text: |
    Gharra Ashmane unosi topór i idzie ku tobie bez pośpiechu. Za nią jeńcy z Kessford
    przyparli jej ostatniego łucznika do kamieni ogniska.
  victory:
    text: |
      Wodzini osuwa się na kolana obok zimnego stosu, a potem pada. Tu, ponad chmurami, nic
      już nie stoi między tobą a ogniem.
  escape:
    text: |
      Wyrywasz się i zbiegasz ścieżką ze szczytu. Gharra pozwala ci odejść; ma przed sobą
      całą noc.

- id: warlord-and-guard
  text: |
    Gharra Ashmane unosi topór i idzie ku tobie bez pośpiechu. Na kamieniach ogniska za nią
    jej ostatni łucznik nakłada strzałę na cięciwę.
  victory:
    text: |
      Wodzini osuwa się na kolana obok zimnego stosu, a potem pada. Tu, ponad chmurami, nic
      już nie stoi między tobą a ogniem.
  escape:
    text: |
      Wyrywasz się i zbiegasz ścieżką ze szczytu, a obok świszczą strzały. Gharra pozwala ci
      odejść; ma przed sobą całą noc.
