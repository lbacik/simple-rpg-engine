schemaVersion: 1
id: the-drowned-ledger
title: The Drowned Ledger
description: Descend beneath a failing sea wall, recover a city's hidden history, and
  decide what the living owe the dead. Repairs can buy time; only a choice can close the
  account.
author: Simple RPG Engine contributors
version: "1.0.0"
language: en
intro: |
  You reach Greyhaven on the morning the tide stops going out. The sea presses against
  the harbour wall under a clear sky, rising without wind or rain.

  Below the wall lies Lowwater, a district flooded sixty years ago. People above say it
  was empty. Through the clear water, you can see someone setting a table.
