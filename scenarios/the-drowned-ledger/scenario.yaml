schemaVersion: 2
id: the-drowned-ledger
title: The Drowned Ledger
description: Descend beneath a failing sea wall, recover a city's hidden history, and
  decide what the living owe the dead. Repairs can buy time; only a choice can close the
  account.
author: Simple RPG Engine contributors
version: "1.0.1"
language: en
intro: |
  You reach Greyhaven in the morning, when the tide should be going out. Something is
  wrong: the ebb never comes. The sky is clear, with no wind or rain, yet the sea keeps
  rising and pressing against the harbour wall.

  Below the wall, under the water, lies Lowwater, a district flooded sixty years ago.
  People in the upper city insist that nobody was there when it was flooded. Yet
  through the clear water, you can see someone in one of the drowned houses setting a
  table.
