# Surrender and draw texts are drafts for human review in P3b (#235).
- id: porter-fight
  text: |
    Elias zamyka księgę gości i unosi kasownik do biletów jak ostrze.
    „Nie ma twojego podpisu” — mówi niemal błagalnie.
  victory:
    text: |
      Mundur zapada się wokół suchej księgi gości. Kładziesz ją na spoczniku,
      zanim przejdziesz do Lowwater.
  surrender:
    text: |
      Otwierasz puste dłonie i klękasz na stopniach. Elias opuszcza kasownik,
      podnosi księgę i wraca na stanowisko — nigdy nie byłeś intruzem, tylko
      gościem, który nie chciał się podpisać.
  draw:
    text: |
      Stoisz niewzruszenie na schodach, ani nie nacierając, ani nie ustępując,
      aż Elias cofa się za biurko z księgą uniesioną jak tarcza. Do wejścia
      nadal można podejść pokojowo.
- id: foundry-fight
  text: |
    Brygadzista unosi młot, starannie omijając niedokończone formy. Nawet teraz
    próbuje ocalić warsztat.
  victory:
    text: |
      Maska pęka i spada obok pieca. Nera patrzy, jak odkładasz młot,
      zanim zaprosi cię do stołu roboczego.
  surrender:
    text: |
      Kładziesz broń na podłodze i cofasz się z uniesionymi rękami. Brygadzista
      opuszcza młot, zadowolony, że formy są całe, i wraca do pieca — wciąż
      wysłucha, jakie uprawnione zadanie cię tu sprowadza.
  draw:
    text: |
      Trzymasz linię między torami, ani nie ustępując, ani nie zdobywając pola,
      aż brygadzista odstępuje, by strzec swego pieca. Zostaje tam, ranny, lecz
      wciąż gotowy wysłuchać, jakie uprawnione zadanie cię tu sprowadza.
- id: tower-fight
  text: |
    Strażnik cofa się do balustrady latarni i napina łuk. Grot jego strzały
    jest bladym kształtem z soli, wystarczająco ostrym, by był prawdziwy.
  victory:
    text: |
      Łuk zamienia się w odcinek mokrej liny. Opierasz go o balustradę
      i zwracasz się ku lampie awaryjnej.
  surrender:
    text: |
      Wołasz, że się poddajesz, i schodzisz po drabinie z otwartymi dłońmi.
      Strażnik trzyma napięty łuk, aż znajdziesz się poniżej linii strzału,
      po czym wraca na posterunek — nadal możesz wrócić z planem pomiarowym
      lub zgłoszeniem zagrożenia.
  draw:
    text: |
      Trwasz poniżej linii strzału, ani nie wspinając się, ani nie schodząc,
      aż strażnik opuszcza łuk i wraca do warty. Nadal możesz wrócić z planem
      pomiarowym lub zgłoszeniem zagrożenia.
- id: auditor-fight
  text: |
    Rewident rozkłada się w klatkę z karbowników. Jego mosiężne klamry
    otwierają się i zamykają w rytmie skopiowanym z maszyny.
  victory:
    text: |
      Karbowniki rozsypują się po podłodze. Żaden nie nosi imienia.
      Przechodzisz obok nich do biurka rachunkowego.
  surrender:
    text: |
      Klękasz na jedno kolano i nadstawiasz nadgarstki karbownikom. Klamry
      zamykają się na niczym, rytm się rwie, a rewident składa się z powrotem
      w swój rejestr — oba dokumenty uprawnień nadal zapewnią ci wejście.
  draw:
    text: |
      Trzymasz właz, nie posuwając się naprzód i nie cofając szybciej niż
      kancelista liczący monety, aż rewident wycofuje się do rejestru. Hester
      przytrzymuje drzwi; oba dokumenty uprawnień nadal zapewnią ci wejście.
