id: quay-arrival
title: Prom pod żurawiem
text: |
  Starszy przewoźnik leży płasko na mokrym nabrzeżu i sięga po linę tuż poza zasięgiem
  palców. Przewracający się żuraw powalił go na ziemię i zranił mu nogę — przewoźnik
  nie może na niej stanąć. Na dachu magazynu ludzie czekający na prom trwają
  w bezruchu. Weszli tam, gdy woda po raz pierwszy wdarła się na nabrzeże; teraz żuraw
  leży w poprzek zewnętrznych schodów i nie mają jak zejść. Morska woda obmywa już
  najniższe płyty nabrzeża.

  „Bram” — przedstawia się, gdy klękasz obok. „Prowadziłem Mercy przy gorszej pogodzie.
  Nigdy nie sądziłem, że stracę go na własnym stanowisku. Zdejmij z niego żuraw,
  a zabiorę tych ludzi na Wyspę Latarni”.

  Ma dobry plan: przywiązać linę żurawia do pachoła cumowniczego, żeby wrak się nie
  przesunął, a potem użyć magazynowej wciągarki. To wymaga cierpliwości, nie bohaterskich
  czynów.
choices:
  - id: prepare
    text: Pomóż Bramowi rozłożyć liny do holowania.
    outcome:
      text: |
        Pomagasz Bramowi wstać, rozdzielasz liny i oznaczasz tę, której pod żadnym pozorem
        nie wolno przeciąć. Oparty o wciągarkę Bram kiwa głową; prom można uwolnić, gdy
        tylko zechcesz.
