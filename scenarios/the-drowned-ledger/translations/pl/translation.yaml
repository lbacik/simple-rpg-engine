language: pl
baseVersion: 1.0.0
title: Zatopiona księga
description: Zejdź pod zawodzący mur ochronny, odkryj ukrytą historię miasta i zdecyduj, co żywi są
  winni zmarłym. Naprawy mogą kupić czas; tylko wybór może zamknąć rachunek.
intro: |
  Docierasz do Greyhaven w poranek, gdy morze przestaje się cofać. Pod czystym niebem
  napiera na mur portowy, wznosząc się bez wiatru i deszczu.

  Pod murem leży Lowwater, dzielnica zalana sześćdziesiąt lat temu. Ludzie na górze
  mówią, że była pusta. Przez przejrzystą wodę widzisz, jak ktoś nakrywa do stołu.
