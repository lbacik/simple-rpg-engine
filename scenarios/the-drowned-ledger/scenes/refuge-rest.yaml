id: refuge-rest
illustration: refuge-rest
title: A Bowl of Hot Broth
trigger: on-demand
when:
  health:
    atMost: 39
text: |
  The refuge kitchen has a stove, a patient cook and a kettle that never quite stops
  boiling. You are offered a bowl of broth and a dry place to sit.

  For a while, people ask only whether you need a blanket. The water outside continues
  its work without requiring you to watch every wave.
choices:
  - id: rest
    text: Rest, eat and let the cook dress your wounds.
    outcome:
      text: |
        Your hands stop shaking. Before you rise, the cook puts a sealed medical tin in your
        pack. "You may be needed again. That does not mean you have to go hungry."
      effects:
        - heal: 20
        - give-item:
            item: field-dressings
