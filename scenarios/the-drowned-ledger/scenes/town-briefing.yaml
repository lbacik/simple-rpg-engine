id: town-briefing
title: The Surveyor's Commission
text: |
  Ivo spreads his chart across an empty fish stall. Sixty years ago, Greyhaven flooded
  its lower district to relieve a winter storm. Afterwards, an engine beneath the sea
  wall kept the upper city safe. The official account says Lowwater was empty when the
  gates opened.

  "The engine is losing pressure. I need someone to reset the pumps, replace a broken
  counterweight and recover the original maintenance ledger. The ledger will tell us how
  to close the account."

  He points to the lockhouse. "The inspection stair is dry. Beyond it, I cannot promise
  anything. Captain Venn has the survey seal. People on the quay need help, too. I would
  rather lose a day than pretend they are cargo."
choices:
  - id: accept
    text: Accept the commission and take his chart.
    outcome:
      text: |
        Ivo writes your name beneath his own. "Thank you, {name}. Visit the watch house if you
        want their stores. The lockhouse has a manual release if the captain will not help."
      effects:
        - set-flag: commissioned
        - give-item:
            item: survey-chart
        - give-item:
            item: salt-tonic
            quantity: 2
        - reveal: quay
        - reveal: watch-house
        - reveal: lockhouse
  - id: ask-payment
    text: Ask whether Greyhaven can provide supplies.
    outcome:
      text: |
        "Supplies, yes. A reward, if there is a Greyhaven afterwards." He adds two emergency
        draughts to the chart. You agree to investigate, with no promise to obey whoever built
        the engine.
      effects:
        - set-flag: commissioned
        - give-item:
            item: survey-chart
        - give-item:
            item: salt-tonic
            quantity: 2
        - reveal: quay
        - reveal: watch-house
        - reveal: lockhouse
