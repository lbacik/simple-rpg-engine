id: lockhouse
name: The Northern Lockhouse
description: |
  The sea wall thickens here into a squat lockhouse. Its public door opens onto a dry
  inspection gallery; a barred stair descends below the tide line.

  Three pressure needles shiver behind cracked glass. Two are labelled PUMP and WEIGHT.
  The third reads ACCOUNT, a word scratched into the brass by hand.
