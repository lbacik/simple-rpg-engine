id: bell-chamber
name: The Tidal Bell Chamber
description: |
  The tidal bell hangs horizontally over a well, its mouth facing down into blackness. A
  woman in a water-stained engineer's coat sits beside the chain that restrains its
  clapper.

  Behind her, a narrow hatch leads into the foundations. It bears no lock, only a plate
  engraved with the words: AUTHORITY MUST BE ACCEPTED.
map:
