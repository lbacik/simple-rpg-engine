id: archive-vault
name: The Protected Reading Room
description: |
  Books stand in shelves of pitch-black oak. The high-water mark passes across their
  spines without staining a page. A register lies beneath a glass weight on the central
  desk.

  There is no clerk, but the room has the expectant silence of a place where someone has
  just asked a question.
