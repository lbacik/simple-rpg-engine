id: cistern
illustration: loc-cistern
name: The Overflow Cistern
description: |
  A shallow sheet of black water covers the floor of this chamber. Islands of grating
  lead to a tool cage and a diving cradle. The cradle's signal cord is drawn taut.

  A helmeted figure is visible beyond the glass of the flooded inspection duct. Beside
  the cradle, an unattended speaking tube gives an occasional, very human cough.
