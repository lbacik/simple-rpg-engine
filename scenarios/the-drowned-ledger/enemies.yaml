# Enemy catalog: reusable kinds of opponents, placed through Encounters.

# Profiles follow the #184 Q11 table: drowned-porter → raider, iron-foreman →
# brute, brass-auditor → sentinel, channel-watchman → archer. All statistics
# come from the profile table.

- id: drowned-porter
  name: Elias Rook
  description: A frightened porter bound to the last instruction he received.
  profile: raider

- id: iron-foreman
  name: The Iron Foreman
  description: A workshop guardian made of protective equipment and unfinished orders.
  profile: brute

- id: channel-watchman
  name: The Channel Watchman
  description: A dead archer trying to keep the harbour clear according to obsolete orders.
  profile: archer

- id: brass-auditor
  name: The Brass Auditor
  description: An account guardian made of tally sticks, brass clasps and borrowed authority.
  profile: sentinel
